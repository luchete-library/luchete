[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/**/*.json,assets/fonts/*.txt"
exclude_filter="artifacts/*,build/*,previews/*,tests/*,tools/*,assets/characters/source/*,assets/models/*,*.md,*.cmd"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=".cache/web_templates/web_nothreads_debug.zip"
custom_template/release=".cache/web_templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell="tools/web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
